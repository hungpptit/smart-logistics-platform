<!DOCTYPE html>

<html class="light" lang="vi" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dẫn đường chi tiết | Logistics Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-tint": "#c00100",
                        "outline": "#956d67",

                        "on-secondary-fixed-variant": "#404750",
                        "on-primary-fixed": "#410000",
                        "tertiary-container": "#0071e8",
                        "cloud-gray": "#F4F4F4",
                        "tertiary": "#0059ba",
                        "primary-fixed-dim": "#ffb4a8",
                        "background": "#f9f9f9",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#dce3ee",
                        "inverse-surface": "#2f3131",
                        "primary-fixed": "#ffdad4",
                        "surface-container-high": "#e8e8e8",
                        "inverse-primary": "#ffb4a8",
                        "on-primary-fixed-variant": "#930100",
                        "on-primary-container": "#fffbff",
                        "tertiary-fixed-dim": "#acc7ff",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#bc0100",
                        "on-error": "#ffffff",
                        "deep-onyx": "#161D25",
                        "on-tertiary-container": "#fefcff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004491",
                        "surface-container": "#eeeeee",
                        "logistics-red": "#FF0000",
                        "on-surface-variant": "#603e39",
                        "secondary": "#585f68",
                        "primary-container": "#eb0000",
                        "surface-dim": "#dadada",
                        "tertiary-fixed": "#d7e2ff",
                        "surface": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                        "secondary-container": "#d9e0eb",
                        "inverse-on-surface": "#f1f1f1",
                        "on-tertiary-fixed": "#001a40",
                        "surface-container-low": "#f3f3f3",
                        "outline-variant": "#ebbbb4",
                        "surface-bright": "#f9f9f9",
                        "surface-container-highest": "#e2e2e2",
                        "secondary-fixed-dim": "#c0c7d2",
                        "on-background": "#1a1c1c",
                        "surface-variant": "#e2e2e2",
                        "pure-white": "#FFFFFF",
                        "on-secondary-container": "#5c636d",
                        "on-secondary-fixed": "#151c24"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "margin-mobile": "20px",
                        "base": "8px",
                        "gutter-mobile": "16px",
                        "margin-desktop": "40px",
                        "gutter-desktop": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Montserrat"],
                        "headline-md": ["Montserrat"],
                        "body-md": ["Montserrat"],
                        "label-md": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "display-lg": ["Montserrat"],
                        "label-lg": ["Montserrat"],
                        "button": ["Montserrat"],
                        "body-lg": ["Montserrat"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "button": ["14px", {"lineHeight": "20px", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Montserrat', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .nav-gradient-top {
            background: linear-gradient(to bottom, rgba(22, 29, 37, 0.9) 0%, rgba(22, 29, 37, 0.7) 60%, transparent 100%);
        }
        .nav-gradient-bottom {
            background: linear-gradient(to top, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.95) 80%, transparent 100%);
        }
        .map-pulse {
            position: relative;
        }
        .map-pulse::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: rgba(188, 1, 0, 0.3);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
    </style>
</head>
<body class="bg-cloud-gray overflow-hidden">
<!-- Full Screen Map Container -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" data-alt="A high-contrast professional GPS navigation map view of Ho Chi Minh City streets, showing a clear blue route path winding through modern urban blocks. The map is designed in a minimalist, clean cartographic style with soft grays for buildings and white for secondary roads. A prominent red and white logistics driver arrow icon is positioned on the blue path, moving through a sunlit cityscape. The aesthetic is focused on clarity and professional logistics efficiency with high-fidelity detail." data-location="Ho Chi Minh City" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD3-VB_5qkstxR_ResRVgBqslLZk09wNt7uwI5PyFcSwDgSsmDJT2eam9EIO3qagLAiM7YIqU6r8x_w1u1bOusGtta4S8t-0Z-s7holsubQ46WucFOEEn8YDni0_cVRx1cdd0hn2gGGMcn9KB5Y9XAc82_BU31_StSUUlyuFyRGg71hn4UYa5WP6YOfCc9lXQ6ToJGOIQJS8-VG-8RjyYY83jIN5PV0snwrXdAIWzbcjXAEOVS37auxFA')"></div>
<!-- Animated Route Line (Simulated Overlay) -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="relative w-full h-full">
<!-- Vehicle Indicator -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 map-pulse">
<div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center shadow-lg border-2 border-pure-white rotate-[25deg]">
<span class="material-symbols-outlined text-pure-white text-[28px]" style="font-variation-settings: 'FILL' 1;">navigation</span>
</div>
</div>
<!-- Delivery Stop 1 -->
<div class="absolute top-[40%] left-[60%] -translate-x-1/2 -translate-y-1/2 z-10"><div class="flex flex-col items-center">
<div class="bg-logistics-red text-pure-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-pure-white">
<span class="font-bold text-xs">1</span>
</div>
<div class="w-1 h-2 bg-logistics-red -mt-0.5"></div>
</div></div>
<!-- Delivery Stop 2 -->
<div class="absolute top-[30%] left-[45%] -translate-x-1/2 -translate-y-1/2 z-10"><div class="flex flex-col items-center">
<div class="bg-logistics-red text-pure-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-pure-white">
<span class="font-bold text-xs">2</span>
</div>
<div class="w-1 h-2 bg-logistics-red -mt-0.5"></div>
</div></div>
<!-- Delivery Stop 3 -->
<div class="absolute top-[15%] left-[55%] -translate-x-1/2 -translate-y-1/2 z-10"><div class="flex flex-col items-center">
<div class="bg-logistics-red text-pure-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-pure-white">
<span class="font-bold text-xs">3</span>
</div>
<div class="w-1 h-2 bg-logistics-red -mt-0.5"></div>
</div></div></div>
</div>
</div>
<!-- Top Directional Banner -->
<div class="fixed top-0 left-0 w-full z-20 px-4 pt-4">
<div class="bg-deep-onyx text-pure-white rounded-xl shadow-2xl flex items-center p-5 max-w-lg mx-auto border-l-4 border-logistics-red">
<div class="mr-5 bg-white/10 p-3 rounded-lg">
<span class="material-symbols-outlined text-[48px] text-logistics-red" style="font-variation-settings: 'wght' 700;">turn_right</span>
</div>
<div class="flex-1">
<div class="flex items-baseline gap-1">
<span class="font-headline-lg text-headline-lg-mobile text-logistics-red">200m</span>
<span class="font-label-lg text-label-lg opacity-80 uppercase tracking-wider">sau đó</span>
</div>
<p class="font-headline-md text-headline-md-mobile leading-tight mt-1">Rẽ phải vào đường Hai Bà Trưng</p>
</div>
</div>
</div>
<!-- Floating Action Buttons (Right Side) -->
<div class="fixed right-4 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-4">
<button class="w-14 h-14 bg-pure-white text-deep-onyx rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-all border border-surface-container-highest" id="voiceBtn" onclick="toggleVoice()">
<span class="material-symbols-outlined text-[28px]" id="voiceIcon">volume_up</span>
</button>
<button class="w-14 h-14 bg-pure-white text-deep-onyx rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-all border border-surface-container-highest">
<span class="material-symbols-outlined text-[28px]">search</span>
</button>
<button class="w-14 h-14 bg-pure-white text-deep-onyx rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-all border border-surface-container-highest">
<span class="material-symbols-outlined text-[28px]">layers</span>
</button>
<div class="w-14 h-1 bg-surface-container-highest/50 rounded-full mx-auto"></div>
<button class="w-14 h-14 bg-pure-white text-primary rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-all border border-surface-container-highest">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</div>
<!-- Bottom Information Panel -->
<div class="fixed bottom-0 left-0 w-full z-30 px-4 pb-6">
<div class="max-w-xl mx-auto">
<!-- Stats Panel -->
<div class="bg-pure-white rounded-t-2xl shadow-[0_-10px_30px_rgba(0,0,0,0.1)] p-6 border-b border-surface-container">
<div class="grid grid-cols-3 gap-4 items-center">
<div class="text-center">
<p class="font-label-md text-secondary uppercase tracking-tighter mb-1">Thời gian</p>
<p class="font-headline-lg text-headline-lg text-primary">5 <span class="text-label-lg font-medium text-on-surface">phút</span></p>
</div>
<div class="text-center border-x border-surface-container">
<p class="font-label-md text-secondary uppercase tracking-tighter mb-1">Khoảng cách</p>
<p class="font-headline-lg text-headline-lg text-on-surface">1.2 <span class="text-label-lg font-medium">km</span></p>
</div>
<div class="text-center">
<p class="font-label-md text-secondary uppercase tracking-tighter mb-1">Vận tốc</p>
<p class="font-headline-lg text-headline-lg text-on-surface">35 <span class="text-label-lg font-medium">km/h</span></p>
</div>
</div>
</div>
<!-- Main Actions -->
<div class="bg-pure-white rounded-b-2xl p-4 flex gap-4 items-center shadow-[0_10px_30px_rgba(0,0,0,0.1)]">
<button class="flex-1 bg-primary text-pure-white h-14 rounded-xl flex items-center justify-center gap-3 active:opacity-90 transition-opacity hover:bg-primary-container">
<span class="material-symbols-outlined">report</span>
<span class="font-button text-button">BÁO CÁO SỰ CỐ</span>
</button>
<button class="w-14 h-14 bg-surface-container-high text-error rounded-xl flex items-center justify-center active:scale-95 transition-transform" title="Thoát dẫn đường">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'wght' 600;">close</span>
</button>
</div>
<!-- Route Progress Bar (Subtle) -->
<div class="w-full bg-surface-container-highest h-1.5 mt-4 rounded-full overflow-hidden">
<div class="bg-logistics-red h-full w-[82%] rounded-full shadow-[0_0_8px_rgba(188,1,0,0.4)]"></div>
</div>
</div>
</div>
<!-- Alert Overlay (Simulated dynamic event) -->
<div class="fixed bottom-56 left-1/2 -translate-x-1/2 z-40 w-[90%] max-w-sm flex opacity-0 hidden" id="trafficAlert">
<div class="bg-[#FFF4E5] border border-[#FF9800] rounded-xl p-4 flex items-center gap-4 shadow-xl animate-bounce">
<span class="material-symbols-outlined text-[#FF9800] text-[32px]">warning</span>
<div>
<p class="font-label-lg text-[#663C00] font-bold">Kẹt xe phía trước</p>
<p class="text-xs text-[#663C00]">Chậm khoảng 3 phút trên đoạn đường Hai Bà Trưng.</p>
</div>
</div>
</div>
<script>
        let isVoiceOn = true;
        function toggleVoice() {
            isVoiceOn = !isVoiceOn;
            const icon = document.getElementById('voiceIcon');
            const btn = document.getElementById('voiceBtn');
            if (isVoiceOn) {
                icon.innerText = 'volume_up';
                btn.classList.remove('text-secondary');
                btn.classList.add('text-deep-onyx');
            } else {
                icon.innerText = 'volume_off';
                btn.classList.remove('text-deep-onyx');
                btn.classList.add('text-secondary');
            }
        }

        // Simulate traffic alert appearing
        setTimeout(() => {
            const alert = document.getElementById('trafficAlert');
            alert.classList.remove('hidden');
            alert.classList.add('flex');
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                alert.classList.add('opacity-0');
                setTimeout(() => alert.classList.add('hidden'), 500);
            }, 5000);
        }, 3000);

        // Simple vibration simulation for turns (visual only)
        setInterval(() => {
            if (Math.random() > 0.95) {
                document.body.classList.add('translate-x-0.5');
                setTimeout(() => document.body.classList.remove('translate-x-0.5'), 50);
            }
        }, 2000);
    </script>
</body></html>
